<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة AISRP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">AISRP</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#home">الرئيسية</a></li>
                <li><a href="#services">الخدمات</a></li>
                <li><a href="#about">عن المنصة</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero" id="home">
        <div class="hero-content">
            <h1>مرحباً بك في منصة AISRP</h1>
            <p>حلول ذكية، مبتكرة، وسهلة الاستخدام لكل أجهزتك.</p>
            <button class="btn-primary" onclick="showAlert()">ابدأ الآن</button>
        </div>
    </main>

    <section class="services" id="services">
        <h2>خدماتنا</h2>
        <div class="card-container">
            <div class="card">
                <h3>الخدمة الأولى</h3>
                <p>وصف مختصر للخدمة الذكية التي تقدمها المنصة.</p>
            </div>
            <div class="card">
                <h3>الخدمة الثانية</h3>
                <p>تصميم متجاوب وسريع يناسب كافة الاحتياجات.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لمنصة AISRP</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
