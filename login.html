<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة الإدارة للمالكين | ISPF</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 400px; border-top: 5px solid #0284c7; }
        h3 { color: #0f172a; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: 'Cairo'; }
        button { background-color: #f97316; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #ea580c; }
        .error-msg { color: #ef4444; font-weight: 600; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h3>🔐 لوحة تحكم الإدارة والمالكين</h3>
        <input type="text" id="username" placeholder="اسم المستخدم الخاص بالمالك">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="checkLogin()">دخول لوحة التحكم</button>
        <p id="error" class="error-msg">⚠️ البيانات المدخلة غير صحيحة!</p>
    </div>

    <script>
        function checkLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            
            // يمكنك تعيين اسم المستخدم وكلمة المرور الخاصة بك هنا
            if(user === "admin_ispf" && pass === "ispf2026") {
                // عند نجاح الدخول يتم توجيهك للمستودع أو لوحة رفع الملفات السحابية الخاصة بك
                window.location.href = "https://drive.google.com"; // كمثال، أو صفحة الرفع الخاصة بك
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>
</body>
</html>
